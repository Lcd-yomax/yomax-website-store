# For VPS deployment — serves as reverse proxy + static image server
# Not needed for local development

server {
    listen 80;
    server_name api.fixparts.com;  # Change to your domain

    # Serve product images as static files (fast, no Go overhead)
    location /images/ {
        alias /var/www/images/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy everything else to the Go app
    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for sync endpoint
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
