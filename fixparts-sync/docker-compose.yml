services:
  # ─── Go Application ─────────────────────────────
  app:
    build: .
    container_name: fixparts-sync
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - DB_HOST=db
      - IMAGE_DIR=/app/images
    volumes:
      - ./data/images:/app/images
    depends_on:
      db:
        condition: service_healthy

  # ─── PostgreSQL ──────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: fixparts-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-fixparts}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev123}
      POSTGRES_DB: ${DB_NAME:-fixparts}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fixparts}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
