services:
  # ─── Next.js Frontend ────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_REST_API_ENDPOINT: ${NEXT_PUBLIC_REST_API_ENDPOINT}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_DEFAULT_LANGUAGE: ${NEXT_PUBLIC_DEFAULT_LANGUAGE:-en}
        NEXT_PUBLIC_ENABLE_MULTI_LANG: ${NEXT_PUBLIC_ENABLE_MULTI_LANG:-false}
        NEXT_PUBLIC_AVAILABLE_LANGUAGES: ${NEXT_PUBLIC_AVAILABLE_LANGUAGES:-en}
        NEXT_PUBLIC_USE_FIXPARTS: "true"
        NEXT_PUBLIC_FIXPARTS_API_URL: ${NEXT_PUBLIC_FIXPARTS_API_URL:-http://fixparts-sync:8080}
    container_name: yomax-frontend
    restart: unless-stopped
    expose:
      - "3003"
    environment:
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - SECRET=${SECRET}
      - NODE_ENV=production
    networks:
      - backend_net
      - web

  # ─── Nginx reverse proxy ─────────────────────────
  nginx:
    image: nginx:alpine
    container_name: yomax-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - images_data:/var/www/images:ro
    depends_on:
      - frontend
    networks:
      - backend_net
      - web

# ─── Shared resources from existing backend stack ────────────────
volumes:
  images_data:
    external: true
    name: bakend-prj_images_data   # volume created by fixparts-sync stack

networks:
  # Existing network where fixparts-sync, fixparts-db live
  backend_net:
    external: true
    name: bakend-prj_internal
  # Internal network between frontend and nginx
  web:
    driver: bridge
