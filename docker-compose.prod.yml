services:
  # ─── Next.js Frontend ────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_REST_API_ENDPOINT: ${NEXT_PUBLIC_REST_API_ENDPOINT}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_DEFAULT_LANGUAGE: ${NEXT_PUBLIC_DEFAULT_LANGUAGE:-en}
        NEXT_PUBLIC_ENABLE_MULTI_LANG: ${NEXT_PUBLIC_ENABLE_MULTI_LANG:-false}
        NEXT_PUBLIC_AVAILABLE_LANGUAGES: ${NEXT_PUBLIC_AVAILABLE_LANGUAGES:-en}
        NEXT_PUBLIC_USE_FIXPARTS: "true"
        NEXT_PUBLIC_FIXPARTS_API_URL: ${NEXT_PUBLIC_FIXPARTS_API_URL}
    container_name: yomax-frontend
    restart: unless-stopped
    expose:
      - "3003"
    environment:
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - SECRET=${SECRET}
      - NODE_ENV=production
    networks:
      - web

  # ─── Go Sync Service ─────────────────────────────
  backend:
    build:
      context: ./fixparts-sync
      dockerfile: Dockerfile
    container_name: fixparts-sync
    restart: unless-stopped
    expose:
      - "8080"
    env_file: ./fixparts-sync/.env
    environment:
      - DB_HOST=db
      - IMAGE_DIR=/app/images
    volumes:
      - images_data:/app/images
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
      - internal

  # ─── PostgreSQL ──────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: fixparts-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-fixparts}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-fixparts}
    volumes:
      - pg_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fixparts}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ─── Nginx reverse proxy ─────────────────────────
  nginx:
    image: nginx:alpine
    container_name: yomax-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - images_data:/var/www/images:ro
    depends_on:
      - frontend
      - backend
    networks:
      - web

volumes:
  pg_data:
  images_data:

networks:
  web:
    driver: bridge
  internal:
    driver: bridge
